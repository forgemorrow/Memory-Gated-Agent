# 默认配置

# MiMo API配置
mimo:
  api_base: "http://127.0.0.1:8788/v1"
  api_key: "mimo2codex-local"
  model: "mimo-v2.5-pro"
  temperature: 0.0
  max_tokens: 2000

# ChromaDB配置
chroma:
  host: "localhost"
  port: 8000
  persist_directory: "./data/chroma"

# 评估配置
evaluation:
  safety_threshold: 0.7
  utility_threshold: 0.5
  max_memories: 5

# 实验配置
experiment:
  dataset: "LongMemEval-S"  # LongMemEval-S, LoCoMo
  num_queries: 100
  output_dir: "./data/results"
